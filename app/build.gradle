plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shanib.future'
    compileSdk 35

    defaultConfig {
        applicationId "com.shanib.future1200.fixed"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "7.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
